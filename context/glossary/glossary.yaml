# Extended glossary terminology
# Add entries as the team clarifies meanings or introduces new concepts.
# Each entry: definition (required), plus optional relationship / synonyms / notes.

entities: {}
  # example:
  # <entity_name>:
  #   definition: <one-line business definition>
  #   relationship: "<short relationship description, if any>"

concepts:
  vault_contents:
    definition: The files and folders inside the active vault repo, at the folder of the current route.
    notes: All writes to them (upload, replace, create folder) go through `useVaultContents`; creating a vault repo is a separate concept (`useCreateUserRepo`).
  upload_queue:
    definition: The app-wide list of files being uploaded, with a status each (waiting, uploading, conflict, done, skipped, error).
    notes: Owned by `useVaultContents` (`useState`), shown by `UploadQueue.vue`. A file's target path is fixed when it is queued, so navigating away doesn't move it. A "conflict" is a file already at that path, waiting for Replace / Keep both / Skip.
  upload_key:
    definition: A sealed token that lets a phone shortcut write photos to one vault through POST /ingest without a session.
    notes: Issued by POST /upload-key, which also writes the registry file `.gitvault/keys/<kid>.json`; the key is valid while that file exists. Listed on the backup page as "connected devices". See `server/utils/uploadKey.ts`.
